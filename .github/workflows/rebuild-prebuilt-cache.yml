name: Rebuild prebuilt cache

on:
  workflow_dispatch:
  schedule:
    # 台股約 13:30 (Asia/Taipei) 收盤，14:10 (Asia/Taipei) ≈ 06:10 UTC。
    # 若這次執行失敗，retry-prebuilt-cache workflow 會等 15 分鐘後補跑一次。
    - cron: "10 6 * * 1-5"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: rebuild-prebuilt-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-cache:
    # 避免 ubuntu-latest image 切換期間影響排程穩定性。
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild prebuilt cache
        run: python scripts/prebuild_price_cache.py

      - name: Build daily theme report from refreshed cache
        run: python scripts/generate_theme_daily_report.py

      - name: Commit updated cache and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuilt_cache reports/*.md
          if git diff --cached --quiet; then
            echo "No cache or report changes to commit"
            exit 0
          fi
          commit_msg="chore: refresh prebuilt cache and report ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git commit -m "$commit_msg"
          # Generated cache/report files can be updated by another commit while this
          # job is running. During a rebase, prefer this freshly generated commit
          # for those conflicting files so binary .pkl cache files do not stop the
          # scheduled workflow with manual conflict resolution prompts.
          git pull --rebase --strategy-option=theirs origin "${GITHUB_REF_NAME:-main}"
          git push
