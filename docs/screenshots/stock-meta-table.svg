<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">總表個人標籤欄位</title>
  <desc id="desc">展示總表中操作方法、個股特性、行情階段、風險與觀察欄位的下拉選單與備註欄位。</desc>
  <rect width="1280" height="720" fill="#f4f7fb"/>
  <rect x="56" y="56" width="1168" height="608" rx="20" fill="#fff" stroke="#dbe4f0"/>
  <text x="88" y="108" fill="#172033" font-size="28" font-family="Arial, 'Noto Sans TC', sans-serif" font-weight="700">總表個人標籤與觀察備註</text>
  <text x="88" y="140" fill="#64748b" font-size="17" font-family="Arial, 'Noto Sans TC', sans-serif">直接在總表為每檔股票設定操作、特性、行情階段與風險觀察。</text>
  <g font-family="Arial, 'Noto Sans TC', sans-serif">
    <rect x="88" y="184" width="1104" height="46" rx="10" fill="#eff6ff"/>
    <text x="104" y="213" fill="#1e3a8a" font-size="15" font-weight="700">代號</text>
    <text x="204" y="213" fill="#1e3a8a" font-size="15" font-weight="700">名稱</text>
    <text x="326" y="213" fill="#1e3a8a" font-size="15" font-weight="700">形勢判斷</text>
    <text x="500" y="213" fill="#1e3a8a" font-size="15" font-weight="700">操作方法</text>
    <text x="640" y="213" fill="#1e3a8a" font-size="15" font-weight="700">個股特性</text>
    <text x="780" y="213" fill="#1e3a8a" font-size="15" font-weight="700">行情階段</text>
    <text x="920" y="213" fill="#1e3a8a" font-size="15" font-weight="700">風險與觀察</text>
    <text x="1080" y="213" fill="#1e3a8a" font-size="15" font-weight="700">備註</text>

    <g transform="translate(88,250)">
      <rect width="1104" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="16" y="43" fill="#0f172a" font-size="16">2330.TW</text>
      <text x="116" y="43" fill="#0f172a" font-size="16">台積電</text>
      <text x="238" y="43" fill="#16a34a" font-size="16" font-weight="700">🟢 偏多</text>
      <rect x="404" y="18" width="120" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="416" y="40" fill="#0f172a" font-size="14">設定操作方法</text><path d="M510 31l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2"/>
      <rect x="544" y="18" width="120" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="556" y="40" fill="#0f172a" font-size="14">強勢股</text><path d="M650 31l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2"/>
      <rect x="684" y="18" width="120" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="696" y="40" fill="#0f172a" font-size="14">主升段前段</text><path d="M790 31l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2"/>
      <rect x="824" y="18" width="120" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="836" y="40" fill="#0f172a" font-size="14">量縮觀察</text><path d="M930 31l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2"/>
      <rect x="984" y="18" width="96" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/>
    </g>
    <g transform="translate(88,336)">
      <rect width="1104" height="70" rx="10" fill="#fff" stroke="#e2e8f0"/>
      <text x="16" y="43" fill="#0f172a" font-size="16">4977.TW</text>
      <text x="116" y="43" fill="#0f172a" font-size="16">眾達-KY</text>
      <text x="238" y="43" fill="#f59e0b" font-size="16" font-weight="700">🟡 觀察</text>
      <rect x="404" y="18" width="120" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="416" y="40" fill="#0f172a" font-size="14">波段</text><path d="M510 31l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2"/>
      <rect x="544" y="18" width="120" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="556" y="40" fill="#0f172a" font-size="14">題材股</text><path d="M650 31l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2"/>
      <rect x="684" y="18" width="120" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="696" y="40" fill="#0f172a" font-size="14">突破觀察</text><path d="M790 31l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2"/>
      <rect x="824" y="18" width="120" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="836" y="40" fill="#0f172a" font-size="14">追高風險</text><path d="M930 31l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2"/>
      <rect x="984" y="18" width="96" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/>
    </g>
  </g>
  <rect x="88" y="460" width="1104" height="120" rx="16" fill="#f8fbff" stroke="#bfdbfe"/>
  <text x="120" y="506" fill="#1e3a8a" font-size="19" font-family="Arial, 'Noto Sans TC', sans-serif" font-weight="700">欄位寬度已預留更多空間</text>
  <text x="120" y="538" fill="#64748b" font-size="16" font-family="Arial, 'Noto Sans TC', sans-serif">下拉選單預設文字不再緊貼右側箭頭，總表閱讀與操作更清楚。</text>
</svg>
